[package]
name = "pyxamp-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
futures-util = "0.3"
libc = "0.2"
pipewire = "0.9"
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "pyxamp-daemon"
path = "src/main.rs"

[[bin]]
name = "pyxampctl"
path = "src/bin/pyxampctl.rs"

[[bin]]
name = "pyxamp-schema"
path = "src/bin/schema.rs"
